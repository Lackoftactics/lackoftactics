<svg width="100%" viewBox="0 0 680 110" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Przemek Mroczek — GitHub profile banner</title>

  <defs>
    <clipPath id="tagclip">
      <rect x="0" y="68" height="20" width="0">
        <animate attributeName="width" from="0" to="320" dur="2s" begin="0.5s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="linkclip">
      <rect x="0" y="90" height="20" width="0">
        <animate attributeName="width" from="0" to="220" dur="1.2s" begin="2.8s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

